<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Badge Icon -->
  <g transform="translate(10, 15)">
    <rect x="0" y="0" width="90" height="90" rx="20" fill="url(#goldGrad)" filter="url(#glow)"/>
    <!-- Modern Tow Truck Icon -->
    <path d="M22 62h6m34 0h6M20 54h32v8H20zm32-14h14l8 10v12H52zm-32 4h26v6H20z" fill="#0B0F19" />
