    <!-- Wheels -->
    <circle cx="32" cy="62" r="6" fill="#0B0F19"/>
    <circle cx="32" cy="62" r="2.5" fill="#F59E0B"/>
    <circle cx="68" cy="62" r="6" fill="#0B0F19"/>
    <circle cx="68" cy="62" r="2.5" fill="#F59E0B"/>
  </g>

  <!-- Text -->
  <text x="120" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" fill="#FFFFFF" letter-spacing="-0.5">
    ABSCHLEPPDIENST <tspan fill="url(#goldGrad)">DIREKT</tspan>
  </text>
  <text x="122" y="84" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#94A3B8" letter-spacing="3">
